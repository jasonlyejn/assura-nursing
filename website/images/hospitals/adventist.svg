<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <rect width="160" height="160" rx="20" fill="#FFFFFF"/>
  <rect x="4" y="4" width="152" height="152" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Adventist Blue Flame & Cross -->
  <g transform="translate(80, 50)">
    <circle cx="0" cy="0" r="28" fill="#EFF6FF"/>
    <!-- 3-part Flame -->
    <path d="M 0 -22 C 4 -16, 12 -12, 10 -2 C 8 6, 0 12, 0 18 C 0 12, -8 6, -10 -2 C -12 -12, -4 -16, 0 -22 Z" fill="#1E3A8A"/>
    <path d="M 4 -18 C 10 -12, 16 -6, 14 4 C 12 12, 4 18, 0 22 C 6 16, 12 10, 10 2 C 8 -6, 2 -12, 4 -18 Z" fill="#3B82F6"/>
    <!-- Medical Cross -->
    <rect x="-3" y="-8" width="6" height="20" rx="1" fill="#FFFFFF"/>
    <rect x="-10" y="-2" width="20" height="6" rx="1" fill="#FFFFFF"/>
  </g>
  <!-- Typography -->
  <text x="80" y="104" font-family="Arial, sans-serif" font-size="10.5" font-weight="900" fill="#1E3A8A" text-anchor="middle">PENANG ADVENTIST</text>
  <text x="80" y="118" font-family="Arial, sans-serif" font-size="9" font-weight="800" fill="#1E3A8A" text-anchor="middle" letter-spacing="0.5">HOSPITAL</text>
  <text x="80" y="134" font-family="'Noto Sans SC', Arial, sans-serif" font-size="9" font-weight="700" fill="#475569" text-anchor="middle">槟城七日安息日会医院</text>
  <text x="80" y="148" font-family="Arial, sans-serif" font-size="6.5" font-weight="600" fill="#64748B" text-anchor="middle">BURMAH ROAD · GEORGETOWN</text>
</svg>