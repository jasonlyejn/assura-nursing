<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How did we do? · Assura Nursing Care</title>
<link rel="icon" href="/icon-192.png">
<style>
  :root{--navy:#0C3054;--blue:#186084;--line:#dbe4ec;--muted:#6a7d90;--amber:#F6B042}
  *{box-sizing:border-box}
  body{margin:0;background:#eef3f9;font-family:'Helvetica Neue',Arial,'Noto Sans CJK SC',sans-serif;
    color:var(--navy);padding:16px;line-height:1.55}
  .wrap{max-width:520px;margin:0 auto;background:#fff;border-radius:16px;padding:22px 20px 26px;
    box-shadow:0 10px 40px rgba(12,48,84,.10)}
  .logo{display:block;height:44px;margin:0 auto 14px}
  h1{font-size:1.25rem;margin:0 0 4px;text-align:center}
  .sub{text-align:center;color:var(--muted);font-size:.9rem;margin:0 0 18px}
  .zh{color:var(--muted);font-size:.86rem}
  label{display:block;font-weight:700;font-size:.88rem;margin:16px 0 6px}
  textarea,input[type=text]{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;resize:vertical}
  .stars{display:flex;gap:6px}
  .stars button{flex:1;font-size:1.6rem;line-height:1;background:#f6f9fc;border:1px solid var(--line);
    border-radius:10px;padding:9px 0;cursor:pointer;color:#cfd8e2}
  .stars button.on{color:var(--amber);background:#fffaf0;border-color:var(--amber)}
  .yn{display:flex;gap:8px}
  .yn button{flex:1;padding:11px;border:1px solid var(--line);background:#fff;border-radius:10px;
    font:inherit;font-weight:700;cursor:pointer;color:var(--muted)}
  .yn button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
  .go{width:100%;margin-top:22px;padding:15px;border:none;border-radius:12px;background:var(--navy);
    color:#fff;font:inherit;font-size:1.02rem;font-weight:800;cursor:pointer}
  .go:disabled{opacity:.5}
  .msg{text-align:center;padding:30px 10px}
  .msg .big{font-size:2.6rem}
  .err{color:#c0392b;text-align:center;font-weight:700}
  .foot{text-align:center;color:var(--muted);font-size:.76rem;margin-top:16px}
</style>
</head>
<body>
<div class="wrap" id="wrap"><p class="sub">Loading…</p></div>

<script>
const q = new URLSearchParams(location.search);
const token = q.get('t') || '';
const wrap = document.getElementById('wrap');
const state = { rating:0, care_rating:0, comm_rating:0, recommend:null };

function stars(key){
  return `<div class="stars" data-k="${key}">` +
    [1,2,3,4,5].map(n=>`<button type="button" data-n="${n}">★</button>`).join('') + `</div>`;
}

async function start(){
  if(!token){ wrap.innerHTML = '<p class="err">This link is incomplete.</p>'; return; }
  let info;
  try{
    const r = await fetch('/api/feedback/'+token);
    const text = await r.text().catch(() => '');
    try { info = text ? JSON.parse(text) : {}; } catch (_) { info = { error: `Server response (${r.status})` }; }
    if(!r.ok) throw new Error(info.error||'Link not valid');
  }catch(e){ wrap.innerHTML = '<p class="err">'+e.message+'</p>'; return; }

  if(info.done){ thanks(true); return; }

  wrap.innerHTML = `
    <img class="logo" src="/logo.png" alt="Assura Nursing Care">
    <h1>How did we do?</h1>
    <p class="sub">Your feedback helps us care better.<br><span class="zh">您的意见能帮助我们做得更好。</span></p>

    <label>Overall, how was our care? <span class="zh">整体服务</span></label>${stars('rating')}
    <label>The nurse / caregiver <span class="zh">护理人员</span></label>${stars('care_rating')}
    <label>Keeping you informed <span class="zh">沟通与通知</span></label>${stars('comm_rating')}

    <label>Would you recommend us? <span class="zh">您会推荐我们吗？</span></label>
    <div class="yn" id="yn">
      <button type="button" data-v="1">👍 Yes 会</button>
      <button type="button" data-v="0">👎 No 不会</button>
    </div>

    <label>What went well? <span class="zh">哪里做得好？</span></label>
    <textarea id="went_well" rows="3" placeholder="Optional"></textarea>

    <label>What could we do better? <span class="zh">哪里可以改进？</span></label>
    <textarea id="improve" rows="3" placeholder="Optional"></textarea>

    <label>Anyone you'd like to thank? <span class="zh">想感谢的同事</span></label>
    <input type="text" id="staff_praise" placeholder="Optional — a nurse's name">

    <label>Your name <span class="zh">您的称呼</span></label>
    <input type="text" id="name" placeholder="Optional">

    <button class="go" id="go">Send feedback 提交</button>
    <p class="foot">Assura Nursing Care · assuranursing.com</p>`;

  wrap.querySelectorAll('.stars').forEach(row=>{
    row.addEventListener('click', e=>{
      const b = e.target.closest('button'); if(!b) return;
      const n = +b.dataset.n, k = row.dataset.k;
      state[k] = n;
      [...row.children].forEach((c,i)=>c.classList.toggle('on', i < n));
    });
  });
  document.getElementById('yn').addEventListener('click', e=>{
    const b = e.target.closest('button'); if(!b) return;
    state.recommend = b.dataset.v === '1';
    [...b.parentNode.children].forEach(c=>c.classList.toggle('on', c===b));
  });
  document.getElementById('go').addEventListener('click', send);
}

async function send(){
  if(!state.rating){ alert('Please tap the stars for an overall rating.'); return; }
  const btn = document.getElementById('go');
  btn.disabled = true; btn.textContent = 'Sending…';
  const body = { ...state,
    went_well: val('went_well'), improve: val('improve'),
    staff_praise: val('staff_praise'), name: val('name') };
  try{
    const r = await fetch('/api/feedback/'+token, {
      method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
    const text = await r.text().catch(() => '');
    let d = {};
    try { d = text ? JSON.parse(text) : {}; } catch (_) { d = { error: `Server error (${r.status})` }; }
    if(!r.ok) throw new Error(d.error||'Could not send');
    thanks(false);
  }catch(e){
    btn.disabled = false; btn.textContent = 'Send feedback 提交';
    alert(e.message);
  }
}
const val = id => (document.getElementById(id)||{}).value || '';

function thanks(already){
  wrap.innerHTML = `<div class="msg">
    <img class="logo" src="/logo.png" alt="Assura Nursing Care">
    <div class="big">🙏</div>
    <h1>${already ? 'Already received' : 'Thank you'}</h1>
    <p class="sub">${already
      ? 'We have your feedback — thank you.<br><span class="zh">我们已收到您的意见，谢谢。</span>'
      : 'We really appreciate you taking the time.<br><span class="zh">感谢您抽空给予意见。</span>'}</p>
    <p class="foot">Assura Nursing Care · assuranursing.com</p></div>`;
}
start();
</script>
</body>
</html>
