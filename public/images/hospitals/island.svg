<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <rect width="160" height="160" rx="20" fill="#FFFFFF"/>
  <rect x="4" y="4" width="152" height="152" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Island Teal Ring & Medical Cross Wave -->
  <g transform="translate(80, 52)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#008080" stroke-width="4"/>
    <circle cx="0" cy="0" r="22" fill="#E6F4F4"/>
    <!-- Medical Cross -->
    <rect x="-4" y="-14" width="8" height="28" rx="2" fill="#008080"/>
    <rect x="-14" y="-4" width="28" height="8" rx="2" fill="#008080"/>
    <!-- Center Pulse -->
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
    <!-- Dynamic Wave Accent -->
    <path d="M -18 8 Q -9 18 0 8 Q 9 -2 18 8" fill="none" stroke="#0A2540" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Typography -->
  <text x="80" y="108" font-family="Arial, sans-serif" font-size="16" font-weight="900" fill="#008080" text-anchor="middle" letter-spacing="-0.5">island</text>
  <text x="80" y="126" font-family="Arial, sans-serif" font-size="14" font-weight="900" fill="#0A2540" text-anchor="middle" letter-spacing="-0.5">hospital</text>
  <text x="80" y="144" font-family="Arial, sans-serif" font-size="7.5" font-weight="800" fill="#008080" text-anchor="middle" letter-spacing="1.5">PENANG · MALAYSIA</text>
</svg>