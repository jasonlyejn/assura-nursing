<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <rect width="160" height="160" rx="20" fill="#FFFFFF"/>
  <rect x="4" y="4" width="152" height="152" rx="16" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  <!-- LSC Red Cross & Monogram -->
  <g transform="translate(80, 50)">
    <rect x="-28" y="-22" width="56" height="44" rx="8" fill="#DC2626"/>
    <!-- White Medical Cross inside -->
    <rect x="-5" y="-16" width="10" height="32" rx="2" fill="#FFFFFF"/>
    <rect x="-16" y="-5" width="32" height="10" rx="2" fill="#FFFFFF"/>
    <!-- Bold LSC text over cross -->
    <circle cx="0" cy="0" r="11" fill="#0C2340"/>
    <text x="0" y="4" font-family="Arial, sans-serif" font-size="9" font-weight="900" fill="#FFFFFF" text-anchor="middle">LSC</text>
  </g>
  <!-- Typography -->
  <text x="80" y="105" font-family="Arial, sans-serif" font-size="11.5" font-weight="900" fill="#0C2340" text-anchor="middle">LOH GUAN LYE</text>
  <text x="80" y="120" font-family="Arial, sans-serif" font-size="8.5" font-weight="800" fill="#DC2626" text-anchor="middle" letter-spacing="0.5">SPECIALISTS CENTRE</text>
  <text x="80" y="136" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" fill="#64748B" text-anchor="middle">ESTABLISHED 1975</text>
  <text x="80" y="148" font-family="Arial, sans-serif" font-size="6.5" font-weight="700" fill="#0C2340" text-anchor="middle">PENANG</text>
</svg>